<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of / — switcharooz.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060a09;
            --surface: #0d1412;
            --text: #e8f0ee;
            --text-secondary: #5a6b66;
            --accent: #2dd4bf;
            --accent-dim: rgba(45, 212, 191, 0.08);
            --border: rgba(45, 212, 191, 0.12);
            --radius: 2px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent);
            color: var(--bg);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 720px;
            margin: 0 8vw 0 10vw;
            padding: 12vh 0 10vh;
        }

        /* Hero */
        .hero {
            margin-bottom: 15vh;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(4rem, 14vw, 11rem);
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -0.05em;
            color: var(--text);
            overflow: hidden;
        }

        .hero-title span {
            display: block;
            transform: translateY(110%);
            animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .hero-domain {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        /* Filetree */
        .filetree {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }

        .tree-root {
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            text-transform: lowercase;
        }

        .tree-list {
            list-style: none;
        }

        .tree-item {
            position: relative;
            display: flex;
            align-items: baseline;
            padding: 0.6rem 0;
            border-left: 2px solid transparent;
            margin-left: -1rem;
            padding-left: 1rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }

        .tree-item::before {
            content: attr(data-branch);
            color: var(--text-secondary);
            margin-right: 1rem;
            white-space: pre;
            user-select: none;
        }

        .tree-item:hover,
        .tree-item:focus-within {
            border-left-color: var(--accent);
            background: var(--accent-dim);
            padding-left: 1.5rem;
        }

        .tree-item:focus-within {
            outline: none;
        }

        .tree-name {
            flex: 1;
            color: var(--text);
        }

        .tree-name.folder {
            color: var(--accent);
        }

        .tree-meta {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: right;
            margin-left: 2rem;
            white-space: nowrap;
        }

        .tree-sublist {
            list-style: none;
            margin-top: 0.25rem;
        }

        .tree-sublist .tree-item {
            padding-left: 1rem;
        }

        .tree-sublist .tree-item:hover,
        .tree-sublist .tree-item:focus-within {
            padding-left: 1.5rem;
        }

        /* Preview */
        .preview {
            margin-top: 10vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
        }

        .preview-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .preview-header .prompt {
            color: var(--accent);
            margin-right: 0.5rem;
        }

        .preview-body {
            padding: 1.5rem;
            overflow-x: auto;
        }

        .preview-body pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text);
        }

        .preview-body .key {
            color: var(--accent);
        }

        .preview-body .punct {
            color: var(--text-secondary);
        }

        .preview-body .string {
            color: #a3e635;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        /* Footer */
        footer {
            margin-top: 12vh;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
        }

        /* Animations */
        @keyframes rise {
            to { transform: translateY(0); }
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Mobile */
        @media (max-width: 640px) {
            main {
                margin: 0 6vw;
                padding: 8vh 0;
            }
            .hero {
                margin-bottom: 10vh;
            }
            .tree-item {
                flex-wrap: wrap;
            }
            .tree-meta {
                width: 100%;
                text-align: left;
                margin-left: 0;
                padding-left: 2.5rem;
                margin-top: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="hero">
            <h1 class="hero-title"><span>switcharooz</span></h1>
            <p class="hero-domain">.github.io</p>
        </header>

        <section class="filetree" aria-label="Directory listing">
            <div class="tree-root">~</div>
            <ul class="tree-list">
                <li class="tree-item" data-branch="├──" tabindex="0">
                    <span class="tree-name">README.md</span>
                    <span class="tree-meta">2.1 KB</span>
                </li>
                <li class="tree-item folder-item" data-branch="└──" tabindex="0">
                    <span class="tree-name folder">.well-known/</span>
                    <span class="tree-meta">dir</span>
                    <ul class="tree-sublist">
                        <li class="tree-item" data-branch="    └──" tabindex="0">
                            <span class="tree-name">nostr.json</span>
                            <span class="tree-meta">142 B</span>
                        </li>
                    </ul>
                </li>
            </ul>
        </section>

        <section class="preview" aria-label="File preview">
            <div class="preview-header">
                <span class="prompt">$</span> cat .well-known/nostr.json
            </div>
            <div class="preview-body">
                <pre><code><span class="punct">{</span>
  <span class="key">"names"</span><span class="punct">: {</span>
    <span class="key">"spherum"</span><span class="punct">: </span><span class="string">"<span class="scramble" data-value="48ca053916454f5d6171da28b677ce9a4922e672fb0e5707d1bb69bf1d4b2dff">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</span>"</span>
  <span class="punct">}</span>
<span class="punct">}</span><span class="cursor"></span></code></pre>
            </div>
        </section>

        <footer>
            generated by hand // no frameworks // no tracking
        </footer>
    </main>

    <script>
        (function() {
            const chars = '0123456789abcdef';
            const el = document.querySelector('.scramble');
            if (!el) return;

            const final = el.dataset.value;
            let iteration = 0;

            setTimeout(() => {
                const interval = setInterval(() => {
                    el.textContent = final.split('').map((c, i) => {
                        if (i < iteration) return final[i];
                        return chars[Math.floor(Math.random() * 16)];
                    }).join('');

                    if (iteration >= final.length) {
                        clearInterval(interval);
                        el.textContent = final;
                    }
                    iteration += 1.5;
                }, 28);
            }, 1600);
        })();
    </script>
</body>
</html>
